<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 244" role="img" aria-labelledby="title description">
  <title id="title">CatalogForge reconciliation</title>
  <desc id="description">Incoming music metadata moves through identity resolution and candidate ranking to a reviewable matching decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B1525"/>
      <stop offset="1" stop-color="#101D31"/>
    </linearGradient>
    <style>
      .kicker { font: 600 13px system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 1.9px; fill: #8CABC5; }
      .label { font: 600 20px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #F0F5FC; }
      .detail { font: 400 14px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #A9BED0; }
      .pipe { stroke: #426D83; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 4 8; animation: drift 3s linear infinite; }
      .pulse { opacity: .9; animation: glow 2.5s ease-in-out infinite; }
      @keyframes drift { to { stroke-dashoffset: -48; } }
      @keyframes glow { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .pipe, .pulse { animation: none; } }
    </style>
  </defs>
  <rect width="960" height="244" rx="18" fill="url(#bg)"/>
  <text x="35" y="42" class="kicker">CATALOGFORGE  /  RESOLUTION FLOW</text>
  <path d="M291 134 H339 M617 134 H667" class="pipe" fill="none"/>
  <circle class="pulse" cx="339" cy="134" r="4" fill="#68DCC1"/>
  <circle class="pulse" cx="667" cy="134" r="4" fill="#68DCC1"/>
  <g>
    <rect x="32" y="77" width="259" height="116" rx="12" fill="#14263B" stroke="#30485F"/>
    <rect x="340" y="77" width="277" height="116" rx="12" fill="#14263B" stroke="#30485F"/>
    <rect x="668" y="77" width="260" height="116" rx="12" fill="#14263B" stroke="#30485F"/>
    <rect x="47" y="94" width="4" height="82" rx="2" fill="#68DCC1"/>
    <rect x="355" y="94" width="4" height="82" rx="2" fill="#68DCC1"/>
    <rect x="683" y="94" width="4" height="82" rx="2" fill="#68DCC1"/>
    <text x="65" y="123" class="label">Incoming metadata</text>
    <text x="65" y="151" class="detail">Titles · Artists · ISRC</text>
    <text x="373" y="123" class="label">Resolve &amp; rank</text>
    <text x="373" y="151" class="detail">Arabic / Latin · Catalog index</text>
    <text x="701" y="123" class="label">Reviewable result</text>
    <text x="701" y="151" class="detail">Match · Review · No match</text>
  </g>
  <text x="34" y="221" class="detail">Versioned reference catalogs  ·  Ranked alternatives  ·  Decision evidence</text>
</svg>
